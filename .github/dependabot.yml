version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /examples
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns:
          - "*"
