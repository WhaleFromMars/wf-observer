name: Actionlint

on:
  pull_request:
    paths: &workflow_paths
      - ".github/workflows/**"
  push:
    branches: [main]
    paths: *workflow_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"

          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Check workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color
