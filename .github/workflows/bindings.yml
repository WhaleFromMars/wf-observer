name: Bindings

on:
  pull_request:
    paths: &binding_paths
      - ".github/workflows/bindings.yml"
      - ".github/workflows/bindings-release.yml"
      - "boltffi.toml"
      - "boltffi.ci.toml"
      - "boltffi.release.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/protocol/**"
      - "crates/local-service/**"
      - "crates/wf-observer/**"
      - "crates/wf-observer-ffi/**"
      - "examples/csharp/**"
      - "examples/gradle/**"
      - "examples/gradlew"
      - "examples/gradlew.bat"
      - "examples/java/**"
      - "examples/kotlin/console/**"
      - "examples/python/**"
      - "examples/settings.gradle.kts"
      - "examples/swift/**"
  push:
    branches: [main]
    paths: *binding_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bindings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Package and test native bindings
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Install Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
          key: bindings

      - name: Install BoltFFI CLI
        run: cargo install --locked --version 0.30.1 boltffi_cli

      - name: Package JVM binding
        run: boltffi pack java --deny-skipped

      - name: Package C# binding
        run: boltffi pack csharp --deny-skipped

      - name: Build and package browser binding
        run: boltffi pack wasm --deny-skipped

      - name: Package Python binding
        run: >-
          boltffi pack python --deny-skipped
          --python "${{ steps.python.outputs.python-path }}"

      - name: Run packaged console examples
        shell: bash
        run: |
          cargo build --locked --quiet -p local-service
          service="target/debug/local-service"
          log="${RUNNER_TEMP}/wf-observer-local-service.log"

          "$service" run --print-ticket >"$log" 2>&1 &
          service_pid=$!

          cleanup() {
            if kill -0 "$service_pid" 2>/dev/null; then
              kill -INT "$service_pid"
              wait "$service_pid" || true
            fi
            cat "$log"
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..60}; do
            if grep --quiet "^WF_OBSERVER_ENDPOINT_TICKET=" "$log"; then
              ready=true
              break
            fi
            if ! kill -0 "$service_pid" 2>/dev/null; then
              echo "local service exited before becoming ready" >&2
              exit 1
            fi
            sleep 0.5
          done

          if [[ "$ready" != true ]]; then
            echo "local service did not become ready" >&2
            exit 1
          fi

          ticket="$(sed --quiet 's/^WF_OBSERVER_ENDPOINT_TICKET=//p' "$log" | head --lines 1)"

          "${{ steps.python.outputs.python-path }}" -m venv "${RUNNER_TEMP}/wf-observer-python"
          python="${RUNNER_TEMP}/wf-observer-python/bin/python"
          "$python" -m pip install dist/python/wheelhouse/*.whl
          "$python" examples/python/console/main.py "$ticket"
          dotnet run --project examples/csharp/console -- "$ticket"
          bash examples/gradlew -p examples --no-daemon :java:console:run --args="$ticket"
          bash examples/gradlew -p examples --no-daemon :kotlin:console:run --args="$ticket"

  swift:
    name: Package and test Swift binding
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
          key: bindings-swift

      - name: Install BoltFFI CLI
        run: cargo install --locked --version 0.30.1 boltffi_cli

      - name: Package Swift binding
        run: boltffi --overlay boltffi.ci.toml pack apple --deny-skipped

      - name: Run packaged Swift example
        shell: bash
        run: |
          cargo build --locked --quiet -p local-service
          service="target/debug/local-service"
          log="${RUNNER_TEMP}/wf-observer-local-service.log"

          "$service" run --print-ticket >"$log" 2>&1 &
          service_pid=$!

          cleanup() {
            if kill -0 "$service_pid" 2>/dev/null; then
              kill -INT "$service_pid"
              wait "$service_pid" || true
            fi
            cat "$log"
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..60}; do
            if grep --quiet "^WF_OBSERVER_ENDPOINT_TICKET=" "$log"; then
              ready=true
              break
            fi
            if ! kill -0 "$service_pid" 2>/dev/null; then
              echo "local service exited before becoming ready" >&2
              exit 1
            fi
            sleep 0.5
          done

          if [[ "$ready" != true ]]; then
            echo "local service did not become ready" >&2
            exit 1
          fi

          ticket="$(sed --quiet 's/^WF_OBSERVER_ENDPOINT_TICKET=//p' "$log" | head --lines 1)"
          swift run --package-path examples/swift/console WFObserverConsole "$ticket"
