name: Warm CI caches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-warm.yml"
      - ".github/workflows/ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**/Cargo.toml"
      - "examples/rust/**/Cargo.toml"
      - "xtask/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-ci-caches
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Warm Rust cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile core test targets
        run: >-
          cargo test --locked --profile ci --workspace
          --exclude example-rust-dioxus --all-features --no-run

  binding-tools:
    name: Warm binding tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore binding tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          shared-key: bindings-tools-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install BoltFFI CLI
        run: cargo install --locked --version 0.30.1 boltffi_cli
