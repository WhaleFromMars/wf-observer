[workspace]
resolver = "3"
members = [
    "apps/showcase-dioxus",
    "crates/local-service",
    "crates/memory-reader",
    "crates/protocol",
    "crates/wf-observer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Memflow + Memflow native deps live in crates/memory-reader

tokio = { version = "1.53.1", features = ["full"] } # Trim down the feature set later
iroh = {
    version = "1.0",
    default-features = false,
    features = ["portmapper", "tls-ring"],
}
irpc = { version = "0.17" }
irpc-iroh = { version = "0.17" }

# FFI
boltffi = { version = "0.30" }

# Local application deps
clap = { version = "4.6" }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
tough = { version = "0.24" } # aws-labs impl of https://theupdateframework.io/
self-replace = { version = "1.5" }

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

# Logging / Errors
anyhow = { version = "1.0" }
thiserror = { version = "2.0" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }

# Misc Helpers
directories = { version = "6" }
semver = { version = "1.0" }
url = { version = "2.5.8" }
itertools = { version = "0.15" }

# Boilerplate Helpers
display_doc = { version = "0.2" }
derive_more = { version = "2.1" }
derive_aliases = { version = "0.4" }

# Performance optimizations
parking_lot = { version = "0.12" }
fastant = { version = "0.1" }
hotpath = { version = "0.23" }

# Some dependencies can spam this causing perf issues.
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"

# Optimisations for the dev profile.
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Optimize for build time in CI.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0
